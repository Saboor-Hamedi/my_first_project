[workspace]
members = ["core", "app"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"        # link-time optimization: faster code
codegen-units = 1  # slower compile, faster program
panic = "abort"
strip = true

# Make dependencies fast even in debug builds
[profile.dev.package."*"]
opt-level = 3
