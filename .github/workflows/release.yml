name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# ──────────────────────────────────────────────────────────────────────────────
# Each OS gets its own native installer:
#   Windows  →  mindforge-v{ver}-windows-setup.exe   (NSIS wizard, Next/Next/Finish)
#   macOS    →  mindforge-v{ver}-macos.dmg            (drag-to-Applications)
#   Linux    →  mindforge-v{ver}-linux.deb            (apt install / double-click)
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Tests first ─────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxcb1-dev \
            libxrandr-dev libxss-dev libasound2-dev pkg-config
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace

  # ── Windows NSIS installer (.exe wizard) ────────────────────────────────────
  build-windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc -p app

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\app.exe" "dist\mindforge.exe"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Write installer.nsi
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          $ver = $env:VER
          $out = "dist\mindforge-v${ver}-windows-setup.exe"
          $nsi = @"
          Unicode True
          !define APPNAME    "MindForge"
          !define APPVER     "$ver"
          !define PUBLISHER  "Saboor Hamedi"
          !define WEBSITE    "https://github.com/Saboor-Hamedi/my_first_project"

          Name "`${APPNAME} `${APPVER}"
          OutFile "$out"
          InstallDir "`$PROGRAMFILES64\MindForge"
          InstallDirRegKey HKLM "Software\MindForge" "InstallDir"
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma

          ; ── Wizard pages ────────────────────────────────────────────────────
          !include "MUI2.nsh"
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_LICENSE "LICENSE"
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          ; ── Install ─────────────────────────────────────────────────────────
          Section "MindForge" SEC01
            SectionIn RO
            SetOutPath "`$INSTDIR"
            File "dist\mindforge.exe"

            CreateDirectory "`$SMPROGRAMS\MindForge"
            CreateShortCut  "`$SMPROGRAMS\MindForge\MindForge.lnk"           "`$INSTDIR\mindforge.exe"
            CreateShortCut  "`$SMPROGRAMS\MindForge\Uninstall MindForge.lnk" "`$INSTDIR\Uninstall.exe"
            CreateShortCut  "`$DESKTOP\MindForge.lnk"                        "`$INSTDIR\mindforge.exe"

            WriteRegStr   HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "DisplayName"     "`${APPNAME}"
            WriteRegStr   HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "DisplayVersion"  "`${APPVER}"
            WriteRegStr   HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "Publisher"       "`${PUBLISHER}"
            WriteRegStr   HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "URLInfoAbout"    "`${WEBSITE}"
            WriteRegStr   HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "InstallLocation" "`$INSTDIR"
            WriteRegStr   HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "UninstallString" "`$INSTDIR\Uninstall.exe"
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "NoModify" 1
            WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge" "NoRepair"  1

            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd

          ; ── Uninstall ────────────────────────────────────────────────────────
          Section "Uninstall"
            Delete "`$INSTDIR\mindforge.exe"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir  "`$INSTDIR"
            Delete "`$SMPROGRAMS\MindForge\MindForge.lnk"
            Delete "`$SMPROGRAMS\MindForge\Uninstall MindForge.lnk"
            RMDir  "`$SMPROGRAMS\MindForge"
            Delete "`$DESKTOP\MindForge.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\MindForge"
            DeleteRegKey HKLM "Software\MindForge"
          SectionEnd
          "@
          $nsi | Out-File -FilePath "installer.nsi" -Encoding UTF8

      - name: Build NSIS installer
        shell: pwsh
        run: makensis installer.nsi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/mindforge-v${{ steps.ver.outputs.VERSION }}-windows-setup.exe

  # ── macOS DMG (drag-to-Applications) ────────────────────────────────────────
  build-macos:
    name: macOS DMG (${{ matrix.arch }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            target: x86_64-apple-darwin
            suffix: macos-intel
          - arch: Apple Silicon
            target: aarch64-apple-darwin
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p app

      - name: Get version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .app + .dmg
        run: |
          ver="${{ steps.ver.outputs.VERSION }}"
          mkdir -p dist staging

          # ── .app bundle ──────────────────────────────────────────────────────
          app="staging/MindForge.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp "target/${{ matrix.target }}/release/app" "${app}/Contents/MacOS/MindForge"
          chmod +x "${app}/Contents/MacOS/MindForge"

          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>MindForge</string>
            <key>CFBundleIdentifier</key><string>app.mindforge.MindForge</string>
            <key>CFBundleName</key><string>MindForge</string>
            <key>CFBundleDisplayName</key><string>MindForge</string>
            <key>CFBundleVersion</key><string>${ver}</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # ── Symlink to /Applications so DMG has drag target ─────────────────
          ln -s /Applications "staging/Applications"

          # ── Create DMG from staging folder ───────────────────────────────────
          dmg="dist/mindforge-v${ver}-${{ matrix.suffix }}.dmg"
          hdiutil create \
            -volname "MindForge ${ver}" \
            -srcfolder staging \
            -ov \
            -format UDZO \
            "${dmg}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/mindforge-v${{ steps.ver.outputs.VERSION }}-${{ matrix.suffix }}.dmg

  # ── Linux .deb (apt install / double-click in file manager) ─────────────────
  build-linux:
    name: Linux .deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxcb1-dev \
            libxrandr-dev libxss-dev libasound2-dev pkg-config

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu -p app

      - name: Get version
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          ver="${{ steps.ver.outputs.VERSION }}"
          pkg="mindforge_${ver}_amd64"
          mkdir -p dist "deb/${pkg}/DEBIAN" "deb/${pkg}/usr/bin" \
                        "deb/${pkg}/usr/share/applications" \
                        "deb/${pkg}/usr/share/doc/mindforge"

          cp target/x86_64-unknown-linux-gnu/release/app "deb/${pkg}/usr/bin/mindforge"
          chmod +x "deb/${pkg}/usr/bin/mindforge"

          cat > "deb/${pkg}/DEBIAN/control" <<EOF
          Package: mindforge
          Version: ${ver}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Saboor Hamedi <saboor@mindforge.app>
          Homepage: https://github.com/Saboor-Hamedi/my_first_project
          Description: MindForge
           A distraction-free, Vim-powered note editor for focused writing.
          EOF

          cat > "deb/${pkg}/usr/share/applications/mindforge.desktop" <<EOF
          [Desktop Entry]
          Name=MindForge
          Comment=Distraction-free Vim-powered note editor
          Exec=mindforge
          Icon=mindforge
          Type=Application
          Categories=Utility;TextEditor;
          Terminal=false
          StartupNotify=true
          EOF

          cp LICENSE "deb/${pkg}/usr/share/doc/mindforge/copyright" 2>/dev/null || true

          dpkg-deb --build "deb/${pkg}" "dist/${pkg}.deb"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/mindforge_${{ steps.ver.outputs.VERSION }}_amd64.deb

  # ── Collect everything and publish GitHub Release ───────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show what we're releasing
        run: ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MindForge ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
