name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────────────────────────
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_ext: .exe
            archive_ext: .zip
            archive_cmd: zip

          # ── macOS Intel ──────────────────────────────────────────────────────
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_ext: ""
            archive_ext: .tar.gz
            archive_cmd: tar

          # ── macOS Apple Silicon ───────────────────────────────────────────────
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_ext: ""
            archive_ext: .tar.gz
            archive_cmd: tar

          # ── Linux x64 ────────────────────────────────────────────────────────
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_ext: ""
            archive_ext: .tar.gz
            archive_cmd: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libxdo-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxss-dev \
            libasound2-dev \
            pkg-config

      # ── Cache cargo registry + build artifacts ───────────────────────────
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p app

      # ── Package ───────────────────────────────────────────────────────────
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $name = "mindforge-v${ver}-x86_64-windows"
          mkdir dist
          Copy-Item "target/${{ matrix.target }}/release/app.exe" "dist/mindforge.exe"
          Compress-Archive -Path dist/mindforge.exe -DestinationPath "dist/${name}.zip"
          echo "ASSET=dist/${name}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ASSET_NAME=${name}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ver="${{ steps.version.outputs.VERSION }}"
          os_id=$(echo "${{ matrix.target }}" | sed 's/x86_64/x64/' | sed 's/aarch64/arm64/' | sed 's/-unknown-linux-gnu/-linux/' | sed 's/-apple-darwin/-macos/')
          name="mindforge-v${ver}-${os_id}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/app" "dist/mindforge"
          chmod +x dist/mindforge
          tar -czf "dist/${name}.tar.gz" -C dist mindforge
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${name}.tar.gz" >> "$GITHUB_ENV"

      # ── Build Windows NSIS Installer (optional, best-effort) ─────────────
      - name: Build NSIS Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          choco install nsis -y --no-progress 2>$null | Out-Null

          $nsiContent = @"
          !define APPNAME "MindForge"
          !define VERSION "$ver"
          !define EXE "mindforge.exe"
          OutFile "dist\mindforge-v${ver}-installer-windows.exe"
          InstallDir "\$PROGRAMFILES64\MindForge"
          Section
            SetOutPath "\$INSTDIR"
            File "dist\mindforge.exe"
            CreateShortCut "\$DESKTOP\MindForge.lnk" "\$INSTDIR\mindforge.exe"
            WriteUninstaller "\$INSTDIR\Uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "\$INSTDIR\mindforge.exe"
            Delete "\$INSTDIR\Uninstall.exe"
            Delete "\$DESKTOP\MindForge.lnk"
            RMDir "\$INSTDIR"
          SectionEnd
          "@
          $nsiContent | Out-File -FilePath "installer.nsi" -Encoding ASCII
          makensis installer.nsi
          if (Test-Path "dist\mindforge-v${ver}-installer-windows.exe") {
            echo "NSIS_ASSET=dist/mindforge-v${ver}-installer-windows.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # ── Build .deb package (Linux) ────────────────────────────────────────
      - name: Build .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        continue-on-error: true
        run: |
          ver="${{ steps.version.outputs.VERSION }}"
          name="mindforge_${ver}_amd64"
          mkdir -p "deb_root/${name}/DEBIAN"
          mkdir -p "deb_root/${name}/usr/bin"
          mkdir -p "deb_root/${name}/usr/share/applications"
          cp "target/${{ matrix.target }}/release/app" "deb_root/${name}/usr/bin/mindforge"
          chmod +x "deb_root/${name}/usr/bin/mindforge"
          cat > "deb_root/${name}/DEBIAN/control" <<EOF
          Package: mindforge
          Version: ${ver}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Saboor Hamedi <saboor@mindforge.app>
          Description: MindForge — A distraction-free Vim-powered note editor
          EOF
          cat > "deb_root/${name}/usr/share/applications/mindforge.desktop" <<EOF
          [Desktop Entry]
          Name=MindForge
          Exec=mindforge
          Icon=mindforge
          Type=Application
          Categories=Utility;TextEditor;
          EOF
          dpkg-deb --build "deb_root/${name}" "dist/${name}.deb" && \
            echo "DEB_ASSET=dist/${name}.deb" >> "$GITHUB_ENV" || true

      # ── macOS .app bundle (optional, best-effort) ─────────────────────────
      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          ver="${{ steps.version.outputs.VERSION }}"
          app="dist/MindForge.app"
          mkdir -p "${app}/Contents/MacOS"
          mkdir -p "${app}/Contents/Resources"
          cp "target/${{ matrix.target }}/release/app" "${app}/Contents/MacOS/mindforge"
          chmod +x "${app}/Contents/MacOS/mindforge"
          cat > "${app}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>mindforge</string>
            <key>CFBundleIdentifier</key><string>app.mindforge.MindForge</string>
            <key>CFBundleName</key><string>MindForge</string>
            <key>CFBundleVersion</key><string>${ver}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF
          cd dist && zip -r "MindForge-v${ver}-${{ matrix.target }}.zip" MindForge.app && cd -
          echo "APP_ASSET=dist/MindForge-v${ver}-${{ matrix.target }}.zip" >> "$GITHUB_ENV" || true

      # ── Create / publish GitHub Release ──────────────────────────────────
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "MindForge ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.NSIS_ASSET }}
            ${{ env.DEB_ASSET }}
            ${{ env.APP_ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Workspace tests (separate job, runs in parallel with builds) ──────────
  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libxcb1-dev libxrandr-dev \
            libxss-dev libasound2-dev pkg-config
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run workspace tests
        run: cargo test --workspace
